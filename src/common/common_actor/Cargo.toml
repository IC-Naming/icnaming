[package]
name = "common_actor"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
ic-cdk = "0.18.0"
ic-cdk-macros = "0.18.0"
candid = "0.10.13"
serde = "1.0.219"
common = { path = "../common" }
log = "0.4"

[build-dependencies]
anyhow = "1.0.98"
vergen-gix = { version = "1.0.9", features = ["build", "cargo", "rustc", "si"] }
